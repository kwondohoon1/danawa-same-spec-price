<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>동일스펙 가격비교</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>동일스펙 가격비교</h1>
      <p class="sub">다나와 최저가(매일 수집) 기준 · 그래픽카드 / SSD / RAM</p>
    </div>
  </header>

  <main class="wrap">
    <section class="panel" id="upload-panel">
      <div class="upload-row">
        <label class="drop" id="drop">
          <input type="file" id="file" accept=".xlsx,.xls,.xlsm" hidden>
          <strong>단가표 엑셀 올리기</strong>
          <span>여기로 끌어놓거나 클릭해서 선택 · <em>정산가세팅</em> 시트의 <em>노출가 (2차혜택가)</em> 기준으로 비교합니다</span>
        </label>
        <div class="status">
          <div id="data-status">가격·스펙 데이터 불러오는 중…</div>
          <div id="file-status" class="muted">엑셀은 이 브라우저 안에서만 읽고, 어디에도 전송·저장하지 않습니다.</div>
        </div>
      </div>
    </section>

    <section id="compare" hidden>
      <div class="section-head">
        <h2>자사 제품 vs 동일스펙 최저가</h2>
        <div class="controls">
          <select id="cat-filter">
            <option value="">전체 카테고리</option>
            <option value="VGA">그래픽카드</option>
            <option value="SSD">SSD</option>
            <option value="RAM">RAM</option>
          </select>
          <label class="chk"><input type="checkbox" id="only-expensive"> 최저가보다 비싼 것만</label>
          <button id="clear" type="button" class="ghost">엑셀 지우기</button>
        </div>
      </div>
      <div class="summary" id="summary"></div>
      <div class="table-scroll">
        <table class="grid" id="compare-table">
          <thead>
            <tr>
              <th>카테고리</th>
              <th class="left">모델명</th>
              <th class="left">동일스펙 조건</th>
              <th>노출가<br><small>(2차혜택가)</small></th>
              <th>동일스펙 최저가</th>
              <th>차이</th>
              <th>차이율</th>
              <th>순위</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="browse">
      <div class="section-head">
        <h2>동일스펙 가격표</h2>
        <div class="controls">
          <select id="b-cat">
            <option value="gpu">그래픽카드</option>
            <option value="ssd">SSD</option>
            <option value="ram">RAM</option>
          </select>
          <select id="b-spec"></select>
          <input id="b-search" type="search" placeholder="상품명 검색">
        </div>
      </div>
      <div class="table-scroll">
        <table class="grid" id="browse-table">
          <thead><tr><th>#</th><th class="left">상품명</th><th>최저가</th><th>최저가 대비</th><th>7일 전</th><th>등록월</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <p class="foot muted" id="foot"></p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
